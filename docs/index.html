<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カタログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <div id="app" class="catalog-app">
    <div id="loading" class="state-message">読み込み中...</div>
    <div id="error" class="state-message state-error" hidden></div>
    <header id="catalog-header" class="catalog-header" hidden>
      <div class="catalog-header-inner">
        <img id="header-logo" class="header-logo" alt="" hidden>
        <div class="header-text">
          <h1 id="catalog-name"></h1>
        </div>
      </div>
      <nav id="catalog-nav" class="catalog-nav"></nav>
    </header>
    <main id="catalog-main" class="catalog-main"></main>
    <footer id="catalog-footer" class="catalog-footer" hidden></footer>
  </div>

  <script src="./assets/js/config.js"></script>
  <script src="./assets/js/templates.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
